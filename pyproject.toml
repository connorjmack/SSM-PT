[project]
name = "ssm-pt"
version = "0.1.0"
description = "Web particle tracking for the Salish Sea on NOAA SSCOFS model output"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "oceantracker==0.5.3.9",
    "exceptiongroup==1.3.1",  # imported by oceantracker 0.5.3.9 but not declared in its metadata
    "numpy==2.5.3",
    "xarray==2026.9.0",
    "netcdf4==1.7.4",
    "h5netcdf==1.8.1",
    "h5py==3.16.0",
    "fsspec==2026.9.0",
    "s3fs==2026.9.0",
    "pyproj==3.8.0",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "plumes2==0.0.1.dev0",  # not on PyPI; pinned to a git commit in [tool.uv.sources]
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/ssm_pt"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.uv.sources]
plumes2 = { git = "https://github.com/ebbcarbon/Plumes_Public", rev = "9791c80ff94f706603df0ae473667ccdffd359db" }
